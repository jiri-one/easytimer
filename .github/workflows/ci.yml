name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  tests:
    name: Analyze and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/flutter
      - run: flutter gen-l10n
      - run: git diff --exit-code -- lib/l10n/
      - run: flutter analyze
      - run: flutter test --concurrency=4
      - run: flutter test --concurrency=4 --platform chrome --dart-define=WEB_PLUGIN_TESTS=true test/web_platform_test.dart test/web_wake_lock_test.dart
      - run: flutter test --concurrency=4 --wasm --platform chrome --dart-define=WEB_PLUGIN_TESTS=true test/web_platform_test.dart test/web_wake_lock_test.dart
      - name: Test the Linux idle-inhibition portal on a private bus
        run: |
          socket_dir=$(mktemp -d "${TMPDIR:-/tmp}/easytimer-dbus.XXXXXX")
          socket_dir=$(cd "$socket_dir" && pwd -P)
          trap 'rm -rf "$socket_dir"' EXIT
          dbus-daemon --session --address="unix:path=$socket_dir/bus" \
            --fork --print-pid=3 3>"$socket_dir/pid"
          trap 'kill "$(cat "$socket_dir/pid")"; rm -rf "$socket_dir"' EXIT
          DBUS_SESSION_BUS_ADDRESS="unix:path=$socket_dir/bus" \
          EASYTIMER_PRIVATE_DBUS="unix:path=$socket_dir/bus" \
          EASYTIMER_TEST_SOCKET_DIR="$socket_dir" \
            flutter test --concurrency=4 --no-pub test/wakelock_linux_test.dart

  app:
    name: Web app
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/flutter
      - run: ./tool/build_web.sh
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: app/build/web

  deploy:
    name: GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [tests, app]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
        id: deployment

  linux:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - uses: ./.github/actions/flutter
      - run: flutter build linux --release --no-pub

  android:
    name: Debug APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: ./.github/actions/flutter
      - run: flutter build apk --debug --no-pub

  packaging:
    name: Desktop metadata and icons
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - working-directory: .
        run: sudo apt-get update && sudo apt-get install -y appstream desktop-file-utils
      - working-directory: .
        run: desktop-file-validate packaging/linux/one.jiri.easytimer.desktop
      - working-directory: .
        run: appstreamcli validate --no-net packaging/linux/one.jiri.easytimer.metainfo.xml
      - name: Validate committed icons
        working-directory: .
        # Rasterization varies between the librsvg versions shipped by distributions.
        run: |
          cmp branding/icon.svg packaging/linux/one.jiri.easytimer.svg
          for icon in app/web/favicon.png app/web/icons/*.png app/android/app/src/main/res/mipmap-*/*.png app/fastlane/metadata/android/en-US/images/icon.png packaging/linux/icons/hicolor/*/apps/*.png; do
            test -s "$icon"
            test "$(file --brief --mime-type "$icon")" = image/png
          done
