name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  tests:
    name: Analyze and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/flutter
      - run: flutter gen-l10n
      - run: git diff --exit-code -- lib/l10n/
      - run: flutter analyze
      - run: flutter test
      - run: flutter test --platform chrome test/web_platform_test.dart
      - run: dbus-run-session -- sh -c "EASYTIMER_PRIVATE_DBUS=\"\$DBUS_SESSION_BUS_ADDRESS\" flutter test --no-pub test/wakelock_linux_test.dart"

  app:
    name: Web app
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/flutter
      - run: ./tool/build_web.sh
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: app/build/web

  deploy:
    name: GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [tests, app]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        id: deployment

  linux:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - uses: ./.github/actions/flutter
      - run: flutter build linux --release --no-pub

  android:
    name: Debug APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: ./.github/actions/flutter
      - run: flutter build apk --debug --no-pub

  packaging:
    name: Desktop metadata and icons
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - working-directory: .
        run: sudo apt-get update && sudo apt-get install -y appstream desktop-file-utils
      - working-directory: .
        run: desktop-file-validate packaging/linux/one.jiri.easytimer.desktop
      - working-directory: .
        run: appstreamcli validate --no-net packaging/linux/one.jiri.easytimer.metainfo.xml
      - name: Validate committed icons
        working-directory: .
        # Rasterization varies between the librsvg versions shipped by distributions.
        run: |
          cmp branding/icon.svg packaging/linux/one.jiri.easytimer.svg
          for icon in app/web/favicon.png app/web/icons/*.png app/android/app/src/main/res/mipmap-*/*.png app/fastlane/metadata/android/en-US/images/icon.png packaging/linux/icons/hicolor/*/apps/*.png; do
            test -s "$icon"
            test "$(file --brief --mime-type "$icon")" = image/png
          done
