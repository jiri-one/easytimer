name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: x86_64, flutter_arch: x64 }
          - { runner: ubuntu-24.04-arm, arch: aarch64, flutter_arch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        if: matrix.flutter_arch == 'x64'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Flutter SDK for ARM
        if: matrix.flutter_arch == 'arm64'
        # The git checkout works on ARM, where Flutter has no SDK archive.
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - working-directory: app
        run: flutter pub get --enforce-lockfile
      - working-directory: app
        run: flutter build linux --release --no-pub
      - name: Package
        working-directory: app
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
          FLUTTER_ARCH: ${{ matrix.flutter_arch }}
        run: |
          name="easytimer-${GITHUB_REF_NAME#v}-linux-$PACKAGE_ARCH"
          mkdir "$name"
          cp -r "build/linux/$FLUTTER_ARCH/release/bundle/." "$name/"
          cp ../packaging/linux/one.jiri.easytimer.{desktop,svg,metainfo.xml} "$name/"
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux-${{ matrix.arch }}
          path: app/easytimer-*.tar.gz
          if-no-files-found: error

  android:
    name: Android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Signing key
        working-directory: app/android
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::All four Android signing secrets are required for a tag release."
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE" | base64 -d > release.jks
      - working-directory: app
        run: flutter pub get --enforce-lockfile
      - working-directory: app
        env:
          ANDROID_KEYSTORE_PATH: release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release --no-pub
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk "../dist/easytimer-${GITHUB_REF_NAME#v}-android.apk"
          flutter build apk --release --split-per-abi --no-pub
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "../dist/easytimer-${GITHUB_REF_NAME#v}-android-$abi.apk"
          done
      - name: Remove signing material
        if: always()
        run: rm -f app/android/release.jks
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android
          path: dist/*.apk
          if-no-files-found: error

  web:
    name: Web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - working-directory: app
        run: flutter pub get --enforce-lockfile
      - working-directory: app
        run: ./tool/build_web.sh
      - name: Package
        working-directory: app/build/web
        run: zip -qr "../../easytimer-${GITHUB_REF_NAME#v}-web.zip" .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: web
          path: app/easytimer-*-web.zip
          if-no-files-found: error

  flatpak:
    name: Flatpak
    uses: ./.github/workflows/flatpak.yml

  release:
    name: GitHub release
    needs: [linux, android, web, flatpak]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum -- easytimer-* > SHA256SUMS
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
