id: one.jiri.easytimer
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm22
command: easytimer
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio
modules:
  - name: easytimer
    buildsystem: simple
    subdir: app
    build-options:
      arch:
        x86_64:
          env:
            BUNDLE_PATH: build/linux/x64/release/bundle
        aarch64:
          env:
            BUNDLE_PATH: build/linux/arm64/release/bundle
      append-path: /usr/lib/sdk/llvm22/bin:/run/build/easytimer/flutter/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm22/lib
      env:
        PUB_CACHE: /run/build/easytimer/.pub-cache
    build-commands:
      - flutter build linux --release --no-pub
      - cp -r $BUNDLE_PATH /app/easytimer
      - mkdir -p /app/bin && ln -s /app/easytimer/easytimer /app/bin/easytimer
      - install -Dm644 -t /app/share/applications ../packaging/linux/one.jiri.easytimer.desktop
      - install -Dm644 -t /app/share/metainfo ../packaging/linux/one.jiri.easytimer.metainfo.xml
      - install -Dm644 -t /app/share/icons/hicolor/scalable/apps ../packaging/linux/one.jiri.easytimer.svg
      - install -Dm644 ../LICENSE /app/share/licenses/one.jiri.easytimer/LICENSE
      - install -Dm644 ../NOTICE /app/share/licenses/one.jiri.easytimer/NOTICE
      - install -Dm644 ../packaging/licenses/interval-timer-MIT.txt /app/share/licenses/one.jiri.easytimer/interval-timer-MIT.txt
      - install -Dm644 assets/licenses/DroidSansMono-Apache-2.0.txt /app/share/licenses/one.jiri.easytimer/DroidSansMono-Apache-2.0.txt
      - install -Dm644 /var/lib/flutter/LICENSE /app/share/licenses/one.jiri.easytimer/flutter-LICENSE
    sources:
      - type: git
        url: https://github.com/jiri-one/easytimer.git
        branch: main
      - type: git
        url: https://github.com/flutter/flutter.git
        tag: 3.47.7
        dest: flutter
