name: easytimer
description: A simple interval timer for Linux, the web and Android.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  audioplayers: '>=6.8.1 <6.9.0'
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  wakelock_plus: ^1.8.2
  web: ^1.1.1

dev_dependencies:
  dbus: ^0.8.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: false
  generate: true
  assets:
    - assets/audio/
    - assets/licenses/
  fonts:
    # Flutter's default family must also be local in every build variant.
    - family: Roboto
      fonts:
        - asset: assets/fonts/DroidSansMono.ttf
